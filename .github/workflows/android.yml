name: Build Pixel AI Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PixelAIStudio.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q PixelAIStudio.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/PixelAIStudio assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-AI-Studio-APK
          path: extracted/PixelAIStudio/app/build/outputs/apk/debug/app-debug.apk
